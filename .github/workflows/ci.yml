name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "boto3>=1.34.0,<2.0.0" \
            "pandas>=2.1.0,<3.0.0" \
            "numpy>=1.26.0,<2.0.0" \
            "pyarrow>=17.0.0,<20.0.0" \
            "requests>=2.31.0,<3.0.0" \
            "pytest>=7.4.0,<9.0.0" \
            "moto[s3,athena]>=5.0.0,<6.0.0" \
            "responses>=0.25.0,<1.0.0" \
            "yfinance>=0.2.0,<1.0.0" \
            "flake8>=7.0.0,<8.0.0" \
            "bandit>=1.7.0,<2.0.0" \
            "pip-audit>=2.7.0,<3.0.0" \
            "checkov>=3.0.0,<4.0.0"

      - name: Lint
        run: flake8 utils.py config.py stock_pipeline/ edgar_pipeline/ fred_pipeline/ analysis_pipeline/ monitoring/ tests/

      - name: Security scan (bandit)
        run: |
          bandit -r utils.py config.py stock_pipeline/ \
            edgar_pipeline/ fred_pipeline/ analysis_pipeline/ monitoring/ \
            --severity-level medium -q

      - name: Dependency vulnerability scan (pip-audit)
        # GHSA-w7rc-q6cm-f5gm + GHSA-p3v3-229h-mc63: Airflow 3.x-only fixes, tolerable_risk
        # in single-user local dev — dismissed in Dependabot alerts #10 and #11
        # PYSEC-2026-113: pyarrow, no fix available; PYSEC-2025-183: pyjwt, no fix available
        # PYSEC-2026-172 + PYSEC-2026-173: Airflow 3.x-only fixes, same tolerable_risk pattern
        run: |
          pip-audit -r requirements.txt \
            --ignore-vuln GHSA-w7rc-q6cm-f5gm \
            --ignore-vuln GHSA-p3v3-229h-mc63 \
            --ignore-vuln CVE-2025-66236 \
            --ignore-vuln CVE-2026-25219 \
            --ignore-vuln CVE-2025-54550 \
            --ignore-vuln CVE-2025-32962 \
            --ignore-vuln CVE-2025-58065 \
            --ignore-vuln CVE-2026-27205 \
            --ignore-vuln PYSEC-2026-113 \
            --ignore-vuln PYSEC-2025-183 \
            --ignore-vuln PYSEC-2026-13 \
            --ignore-vuln PYSEC-2026-10 \
            --ignore-vuln PYSEC-2025-85 \
            --ignore-vuln PYSEC-2023-314 \
            --ignore-vuln PYSEC-2024-266 \
            --ignore-vuln PYSEC-2024-265 \
            --ignore-vuln PYSEC-2026-18 \
            --ignore-vuln PYSEC-2024-264 \
            --ignore-vuln PYSEC-2026-172 \
            --ignore-vuln PYSEC-2026-173 \
            --ignore-vuln PYSEC-2026-181 \
            --ignore-vuln PYSEC-2026-186 \
            --ignore-vuln PYSEC-2026-187 \
            --ignore-vuln CVE-2026-46745

      - name: Terraform IaC security scan (checkov)
        run: checkov -d terraform/ --framework terraform --quiet --compact

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85  # v4.0.0

      - name: Terraform fmt check
        run: terraform fmt -check terraform/

      - name: Run tests
        run: pytest tests/ -v
